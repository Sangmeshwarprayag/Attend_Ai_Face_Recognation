

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AttendAI Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
}

/* CARD */

.card{
width:420px;
padding:40px;
border-radius:16px;
background:rgba(17,24,39,0.7);
backdrop-filter:blur(15px);
box-shadow:0 20px 50px rgba(0,0,0,0.7);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

/* TITLE */

.title{
font-size:30px;
text-align:center;
font-weight:600;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:14px;
color:#94a3b8;
margin-bottom:25px;
}

/* TABS */

.tabs{
display:flex;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
text-align:center;
background:#1f2937;
cursor:pointer;
transition:0.3s;
font-size:14px;
}

.tab:hover{
background:#374151;
}

.tab.active{
background:#3b82f6;
}

/* FORM */

.form{
display:none;
}

.form.active{
display:block;
}

/* INPUT */

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid transparent;
background:#020617;
color:white;
font-size:14px;
transition:0.3s;
}

input:focus{
outline:none;
border:1px solid #3b82f6;
box-shadow:0 0 8px rgba(59,130,246,0.5);
}

/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2563eb;
}

button.loading{
opacity:0.7;
pointer-events:none;
}

/* ERROR */

.error{
font-size:13px;
color:#ef4444;
text-align:center;
margin-top:10px;
display:none;
}

/* FOOTER */

.footer{
text-align:center;
font-size:12px;
margin-top:15px;
color:#64748b;
}

</style>

</head>

<body>

<div class="card">

<div class="title">AttendAI</div>
<div class="subtitle">Smart Attendance System</div>

<div class="tabs">
<div class="tab active" onclick="showForm('admin',this)">Admin</div>
<div class="tab" onclick="showForm('teacher',this)">Teacher</div>
<div class="tab" onclick="showForm('student',this)">Student</div>
</div>

<!-- ADMIN -->
<div class="form active" id="admin">
<div class="input-group">
<input id="adminUser" placeholder="Admin Username">
</div>
<div class="input-group">
<input id="adminPass" type="password" placeholder="Password">
</div>
<button id="adminBtn" onclick="login('admin')">Login as Admin</button>
<div class="error" id="adminError"></div>
</div>

<!-- TEACHER -->
<div class="form" id="teacher">
<div class="input-group">
<input id="teacherUser" placeholder="Teacher Username">
</div>
<div class="input-group">
<input id="teacherPass" type="password" placeholder="Password">
</div>
<button id="teacherBtn" onclick="login('teacher')">Login as Teacher</button>
<div class="error" id="teacherError"></div>
</div>

<!-- STUDENT -->
<div class="form" id="student">
<div class="input-group">
<input id="studentUser" placeholder="PRN Number">
</div>
<div class="input-group">
<input id="studentPass" type="password" placeholder="Password">
</div>
<button id="studentBtn" onclick="login('student')">Login as Student</button>
<div class="error" id="studentError"></div>
</div>

<div class="footer">AttendAI © 2026</div>

</div>

<script>

const API="http://127.0.0.1:5000"

/* SWITCH FORMS */

function showForm(role,element){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
element.classList.add("active")

document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"))
document.getElementById(role).classList.add("active")

}

/* LOGIN */

async function login(role){

let username,password,btn,errorBox

if(role==="admin"){
username=adminUser.value
password=adminPass.value
btn=adminBtn
errorBox=adminError
}

if(role==="teacher"){
username=teacherUser.value
password=teacherPass.value
btn=teacherBtn
errorBox=teacherError
}

if(role==="student"){
username=studentUser.value
password=studentPass.value
btn=studentBtn
errorBox=studentError
}

/* VALIDATION */

if(!username || !password){
errorBox.innerText="Please fill all fields"
errorBox.style.display="block"
return
}

/* LOADING */

btn.classList.add("loading")
btn.innerText="Logging in..."

errorBox.style.display="none"

try{

const res=await fetch(API+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({role,username,password})
})

const data=await res.json()

if(data.success){

if(data.role==="admin") window.location="admin_dashboard.html"
if(data.role==="teacher") window.location="teacher_dashboard.html"
if(data.role==="student") window.location="student_dashboard.html"

}else{

errorBox.innerText="Invalid username or password"
errorBox.style.display="block"

}

}catch{

errorBox.innerText="Server not running"
errorBox.style.display="block"

}

/* RESET BUTTON */

btn.classList.remove("loading")
btn.innerText="Login as " + role.charAt(0).toUpperCase() + role.slice(1)

}

</script>

</body>
</html>
