<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendAI Live Attendance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#020617;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:10px;
color:#94a3b8;
text-decoration:none;
border-radius:6px;
margin-bottom:5px;
}

.sidebar a:hover{
background:#1e293b;
color:white;
}

/* MAIN */

.main{
flex:1;
padding:30px;
}

/* CAMERA BOX */

.camera-box{
background:black;
height:420px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
position:relative;
}

video{
width:100%;
height:100%;
border-radius:10px;
object-fit:cover;
}

/* BUTTON */

button{
padding:12px 20px;
background:#3b82f6;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

/* LOG BOX */

.log-box{
background:#020617;
padding:20px;
border-radius:10px;
max-height:250px;
overflow:auto;
}

.log{
padding:8px;
border-bottom:1px solid #1e293b;
font-size:14px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>AttendAI</h2>

<a href="admin_dashboard.html">Dashboard</a>
<a href="live_attendance.html">Live Attendance</a>
<a href="login.html">Logout</a>

</div>


<div class="main">

<h1>Live AI Attendance</h1>

<br>

<div class="camera-box">

<video id="video" autoplay></video>

</div>

<button onclick="startCamera()">Start Camera</button>
<button onclick="startAttendance()">Start AI Attendance</button>

<br><br>

<h2>Recognition Log</h2>

<div class="log-box" id="logBox">

<div class="log">System Ready...</div>

</div>

</div>


<script>

const API="http://127.0.0.1:5000";

let video=document.getElementById("video");


/* START CAMERA */

function startCamera(){

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{

video.srcObject=stream;

});

addLog("Camera Started");

}


/* START AI ATTENDANCE */

function startAttendance(){

addLog("Starting AI Attendance...");

fetch(API+"/start_attendance")

.then(res=>res.json())

.then(data=>{

addLog(data.message);

})

.catch(()=>{

addLog("AI Model running on backend");

});

}


/* LOG FUNCTION */

function addLog(msg){

let logBox=document.getElementById("logBox");

let div=document.createElement("div");

div.className="log";

div.innerText=new Date().toLocaleTimeString()+"  -  "+msg;

logBox.prepend(div);

}

</script>

</body>
</html>
